# Frontend (Next.js)
upstream frontend {
    server 127.0.0.1:3000;
}

# Backend (PHP-FPM)
upstream backend {
    server unix:/run/php/php-fpm.sock;
}

server {
    listen 80;
    server_name seyfibaba.com www.seyfibaba.com;

    location /_next/static {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /uploads/ {
        alias /var/www/shopo/backend/public/uploads/;
    }

    location /_next/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Laravel panel rotaları admin subdomain'de; ana domain'den yönlendir
    location /call-center/ {
        return 301 https://admin.seyfibaba.com$request_uri;
    }

    location /admin/ {
        return 301 https://admin.seyfibaba.com$request_uri;
    }

    location /seller/ {
        return 301 https://admin.seyfibaba.com$request_uri;
    }
}

server {
    listen 80;
    server_name ikinciel.seyfibaba.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ikinciel.seyfibaba.com;

    ssl_certificate /etc/letsencrypt/live/ikinciel.seyfibaba.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ikinciel.seyfibaba.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /_next/static {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /var/www/shopo/backend/public/uploads/;
    }

    location /_next/ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.seyfibaba.com;

    root /var/www/shopo/backend/public;
    index index.php;

    location /uploads/ {
        alias /var/www/shopo/backend/public/uploads/;
        expires 1y;
        add_header Cache-Control "public";
    }
    
    location /storage/ {
        alias /var/www/shopo/backend/public/storage/;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }
    
    location /api/ {
        try_files $uri /index.php?$query_string;
    }
    
        location /seller/ {
        try_files $uri /index.php?$query_string;
    }

    location /call-center/ {
        try_files $uri /index.php?$query_string;
    }
    
    location /admin/ {
        try_files $uri /index.php?$query_string;
    }
}